name: Preview Deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set preview hostname override
        run: echo "SHORTURL_HOSTNAME=scj.io" >> functions/.env

      - name: Deploy to preview channel
        id: deploy
        run: |
          OUTPUT=$(npx firebase-tools@15.5.1 hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --only prod \
            --expires 7d \
            --no-authorized-domains \
            --project scj-short-url 2>&1) || { echo "$OUTPUT"; exit 1; }
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep 'Channel URL' | grep -oP 'https://[^\s\[\]]+')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `🔗 Preview deployed to: ${{ steps.deploy.outputs.url }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview deployed to:')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
