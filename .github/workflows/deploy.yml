name: Production Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGION: us-central1
  SERVICE: shorturl
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go vet ./... && go test ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        id: image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${SERVICE}/${SERVICE}:${GITHUB_SHA::7}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --build-arg VERSION="${GITHUB_SHA::7}" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --platform managed \
            --service-account "shorturl-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 80 \
            --cpu 1 --memory 256Mi \
            --timeout 60 \
            --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The prod Hosting target pins the redirV2 function, so firebase deploy
      # runs the functions predeploy hooks (lint) and needs their dependencies.
      # Remove this step together with functions/ in the cleanup task.
      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy hosting and Firestore rules
        run: |
          npx firebase-tools@15.5.1 deploy \
            --only hosting,firestore:rules \
            --project "$PROJECT_ID" \
            --force
